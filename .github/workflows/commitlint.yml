name: Commitlint

on:
  pull_request:
    branches: [main, dev]
    types: [opened, edited, synchronize, reopened]

jobs:
  commitlint:
    name: Lint PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Lint PR title against Conventional Commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            download
            compress
            vault
            playback
            ui
            db
            ci
          requireScope: false
