name: Bug Report
description: Something is broken
labels: ["type: fix", "priority: med"]
assignees: ["hinode-codes"]
body:
  - type: markdown
    attributes:
      value: "## Bug Report"

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Tap '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      render: shell

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "priority: high"
        - "priority: med"
        - "priority: low"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device / API level
      placeholder: "e.g. Pixel 6, API 34"
